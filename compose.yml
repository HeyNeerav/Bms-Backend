services:
  api:
    image: ghcr.io/heyneerav/business-management-system-backend:latest
    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "3000:3000"

    container_name: bms-api

  mongo:
    image: mongo
    restart: always
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--keyFile", "/etc/mongo-keyfile"]
    ports:
      - 27017:27017
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${DATABASE_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${DATABASE_PASSWORD}
    volumes:
    - mongo:/data/db
    - ./mongo-keyfile:/etc/mongo-keyfile:ro

  mongo-express:
    image: mongo-express
    restart: always
    ports:
      - 8081:8081
    environment:
      ME_CONFIG_MONGODB_URL: ${MONGODB_DOCKER_URI}
      ME_CONFIG_BASICAUTH_ENABLED: true
      ME_CONFIG_BASICAUTH_USERNAME: ${MONGODB_USER}
      ME_CONFIG_BASICAUTH_PASSWORD: ${MONGODB_PASSWORD}

volumes:
  mongo: